apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
  name: abs-payment-processor
  namespace: ndbabs
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: abs-payment-processor
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: abs-payment-processor
    spec:
      volumes:
        - name: pv-volume-abs
        - name: efs-pv
          persistentVolumeClaim:
            claimName: pv-claim-abs
            claimName: efs-pvc
      containers:
        - name: abs-payment-processor-services
          image: 058264110280.dkr.ecr.ap-southeast-1.amazonaws.com/neos-2-0-sit-abs-payment-processor-services:V1.00.00.08.13
          imagePullPolicy: Always
          ports:
            - containerPort: 9399
              protocol: TCP
          resources:
            requests:
              memory: "750Mi"
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: pv-volume-abs
              mountPath: /opt/
            - name: efs-pv
              mountPath: /opt/payment
          env:
            - name: TZ
              value: "Asia/Colombo"
      imagePullSecrets:
        - name: ndbabs
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: false
      restartPolicy: Always
      securityContext: {}
      terminationGracePeriodSeconds: 120
